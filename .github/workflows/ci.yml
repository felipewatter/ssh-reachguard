name: Security Tests and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sshreach-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout pinned by full commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python pinned action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project (no runtime dependencies)
        run: python -m pip install --no-deps .
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q src tests scripts
      - name: Verify baseline and assertions
        shell: python
        run: |
          import subprocess
          import sys
          options = ['--at', '2026-11-10T12:00:00Z']
          cmds = [
              ['sshreachguard','audit','--fleet','examples/baseline.json',*options],
              ['sshreachguard','assert','--fleet','examples/baseline.json','--queries','examples/queries.json',*options],
              ['sshreachguard','compare','--baseline','examples/baseline.json','--candidate','examples/candidate-risky.json','--queries','examples/queries.json',*options]
          ]
          for cmd, expected in zip(cmds, (0, 0, 1)):
              r = subprocess.run(cmd, capture_output=True, text=True, check=False)
              print(r.stdout)
              assert r.returncode == expected, f'{cmd[1]} expected {expected}, got {r.returncode}: {r.stderr}'
      - name: Verify reproducible packaging and source secrecy
        run: python scripts/package.py

  release:
    name: Publish v1.0.0 only after full successful matrix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout pinned by full commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python pinned action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Ensure version contract
        shell: python
        run: |
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          assert project['project']['version'] == '1.0.0'
          assert Path('RELEASE_NOTES.md').exists()
      - name: Deterministic source archive
        run: python scripts/package.py
      - name: GitHub release creation (no overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.0.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace its assets."
            exit 0
          fi
          gh release create "$TAG" \
            dist/ssh-reachguard-v1.0.0-source.zip \
            dist/ssh-reachguard-v1.0.0-source.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "SSH ReachGuard v1.0.0" \
            --notes-file RELEASE_NOTES.md
