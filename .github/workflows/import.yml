name: Temporary SHA-256 source import
on:
  push:
    branches: [main]
    paths:
      - source.ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify expected source digest and extract safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          root = Path.cwd().resolve()
          chunks = [Path(f"source.part.{i:02d}") for i in range(1, 9)]
          raw = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in chunks), validate=True)
          expected = "121ca5d9cfd74f315c3c978c8f48c5dfd389063076584e09963cfb12a63221b0"
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("SHA-256 mismatch. Source import refused.")
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:xz") as archive:
              members = archive.getmembers()
              if len(members) != 34:
                  raise SystemExit(f"Unexpected count: {len(members)}")
              for member in members:
                  if not member.isfile() or member.size > 2_000_000 or member.size < 0:
                      raise SystemExit(f"Unsafe archive entry: {member.name}")
                  path = (root / member.name).resolve()
                  if path == root or root not in path.parents or member.name in files:
                      raise SystemExit(f"Unsafe or duplicated name: {member.name}")
                  files[member.name] = archive.extractfile(member).read()
          mandatory = {".github/workflows/ci.yml", "pyproject.toml", "README.md", "LICENSE", "tests/test_engine.py"}
          if not mandatory.issubset(files) or ".github/workflows/import.yml" in files:
              raise SystemExit("Required source missing or temporary importer modified")
          for name, data in files.items():
              if name == ".github/workflows/ci.yml":
                  continue
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          for p in chunks:
              p.unlink()
          Path("source.ready").unlink()
          print(f"SHA-256 verified; imported {len(files)-1} files. Main CI added separately.")
          PY
      - name: Commit vetted source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import verified SSH ReachGuard v1.0.0 source"
          git push
