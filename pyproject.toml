[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-reachguard"
version = "1.0.0"
description = "Offline SSH authorized_keys reachability and privilege regression gate"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Felipe Silva"}]
keywords = ["ssh", "authorized_keys", "security", "devsecops", "least-privilege"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
sshreachguard = "ssh_reachguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
